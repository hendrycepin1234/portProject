<body> 
    <h1>Contact me</h1>
    <p>If for any reason you wish to contact me please fill out this form and send me what you wish to know</p>



        <form action="contactMePage.html" method = "POST">

            <p>
            <label for = "name">Name:</label>
            <input type ="text" id ="name" name="name" required>
            </p>

            <p>
                <label for "email">Email:</label>
                <input type = "email" id="email" name ="email" required>
            </p>

            <p>
                <label for "subject">Subject:</label>
                <input type = "text" id="subject" name ="subject" required>
            </p>
                
           <p>
                <textarea name="text" rows="6" cols="50" placeholder="Please type here" required></textarea>
           </p>

           <button>Submit</button>


        </form>




    

</body>
